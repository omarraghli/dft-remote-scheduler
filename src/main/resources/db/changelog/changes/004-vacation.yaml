databaseChangeLog:
  - changeSet:
      id: 004-vacation
      author: o.raghli
      comment: Leave. One row per stretch away, whatever its length — a single day off and a
               fortnight are the same shape — because a week only ever asks which of its days
               a person is there for. Dates rather than weekday names, since leave is a date.
      changes:
        - createTable:
            tableName: vacation
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_vacation
                    nullable: false
              - column:
                  name: person_name
                  type: VARCHAR(64)
                  remarks: A name from remote.people, spelled as it is configured.
                  constraints:
                    nullable: false
              - column:
                  name: start_date
                  type: DATE
                  remarks: First day away.
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: DATE
                  remarks: Last day away. The same as the start for a single day off.
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - createIndex:
            tableName: vacation
            indexName: idx_vacation_person
            columns:
              - column:
                  name: person_name

        - createIndex:
            tableName: vacation
            indexName: idx_vacation_dates
            columns:
              - column:
                  name: start_date
              - column:
                  name: end_date

      rollback:
        - dropTable:
            tableName: vacation
