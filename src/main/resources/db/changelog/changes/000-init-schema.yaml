databaseChangeLog:
  - changeSet:
      id: 000-init-schema
      author: o.raghli
      comment: One generated week, and one row per person per remote day within it.
      changes:
        - createTable:
            tableName: week_schedule
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_week_schedule
                    nullable: false
              - column:
                  name: week_start
                  type: DATE
                  remarks: The Monday the week starts on — a week is scheduled at most once.
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_week_schedule_week_start
              - column:
                  name: generated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: generated_by
                  type: VARCHAR(32)
                  remarks: What triggered it — scheduler, api or web.
                  constraints:
                    nullable: false

        - createTable:
            tableName: remote_assignment
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_remote_assignment
                    nullable: false
              - column:
                  name: week_schedule_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_remote_assignment_week_schedule
                    referencedTableName: week_schedule
                    referencedColumnNames: id
                    deleteCascade: true
              - column:
                  name: person_name
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: day_index
                  type: INT
                  remarks: Position in the configured day list, so ordering survives a rename.
                  constraints:
                    nullable: false
              - column:
                  name: day_name
                  type: VARCHAR(32)
                  remarks: The day label as configured, kept so old schedules still read right.
                  constraints:
                    nullable: false

        - createIndex:
            tableName: remote_assignment
            indexName: idx_remote_assignment_week
            columns:
              - column:
                  name: week_schedule_id

        - createIndex:
            tableName: remote_assignment
            indexName: idx_remote_assignment_person
            columns:
              - column:
                  name: person_name

      rollback:
        - dropTable:
            tableName: remote_assignment
        - dropTable:
            tableName: week_schedule
