databaseChangeLog:
  - changeSet:
      id: 002-public-holiday
      author: o.raghli
      comment: Public holidays that move, kept here rather than in configuration because
               the lunar ones are announced days before they fall and have to be entered
               without a redeploy. A holiday is one row however many days it runs.
      changes:
        - createTable:
            tableName: public_holiday
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_public_holiday
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(120)
                  remarks: As it appears on the chart, e.g. Aid Al Fitr.
                  constraints:
                    nullable: false
              - column:
                  name: start_date
                  type: DATE
                  remarks: First day off.
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_public_holiday_start_date
              - column:
                  name: days
                  type: INTEGER
                  defaultValueNumeric: 1
                  remarks: How long it runs. 2 for the Aids.
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

      rollback:
        - dropTable:
            tableName: public_holiday
