spring:
  application:
    name: dft-remote-scheduler

  datasource:
    # Defaults match docker-compose.yml, so `docker compose up -d` then Run works
    # with no environment set up — including straight from the IDE.
    #
    # These are development credentials and are published in this repo; any real
    # deployment MUST override all three, e.g. SPRING_DATASOURCE_PASSWORD.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/dft_remote}
    username: ${SPRING_DATASOURCE_USERNAME:dft_remote}
    password: ${SPRING_DATASOURCE_PASSWORD:dft_remote}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    # Liquibase owns the schema; Hibernate only checks the entities still match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  thymeleaf:
    cache: false

server:
  port: 8080
  servlet:
    session:
      # Cookie only. Otherwise Tomcat rewrites redirect URLs as /;jsessionid=... on the first
      # request of a session, which Spring MVC then fails to match — the "Generate" button on
      # the page 404s for anyone arriving without a session cookie.
      tracking-modes: cookie

# ---------------------------------------------------------------------------
# The schedule itself. Nothing here is hardcoded in Java.
# ---------------------------------------------------------------------------
remote:
  people:
    - Sara
    - Rajae
    - Salma
    - Adam
    - Oussama
    - Outman
    - Ayoub
    - Omar
    - Nassim
    - Adnan
    - Anass
    - Mahmoud
    - Hamza
    - Nader
    - MedAli
    - MedKhalil

  days: [Lundi, Mardi, Mercredi, Jeudi, Vendredi]

  # Remote capacity per day, one entry per day above.
  slots-per-day: [10, 10, 10, 10, 10]

  # Every person gets exactly this many remote days.
  remotes-per-person: 3

  # 2 means "never 3 remote days in a row".
  max-consecutive-days: 2

  # Weekday names with no remote work, in every week — a standing closure, not a date. Public
  # holidays go under public-holidays below, which is dated and lowers the quota on its own.
  # Mind the capacity: 16 people x 3 days = 48 remote days needed, against 5 x 10 = 50 slots.
  # Removing a day leaves 40 and makes the week infeasible, so drop remotes-per-person to 2.
  holidays: []

  # People who cannot be remote on a given day, e.g. the day they come back from vacation.
  vacation-returns: {}
  #  Oussama: Lundi
  #  Sara: Jeudi

  # Moroccan public holidays. A holiday closes its column — nobody is remote on a day the office
  # is shut — and shortens the week, so the quota drops with it.
  public-holidays:
    # Remote days per person, keyed by how many holidays land on a working day that week. A count
    # with no entry of its own uses the highest entry below it, so 2 also covers 3 and 4.
    quotas:
      1: 2
      2: 1

    # The national days: same Gregorian date every year, MM-dd.
    annual:
      - { day: 01-01, name: Nouvel An }
      - { day: 01-11, name: Manifeste de l'Indépendance }
      - { day: 01-14, name: Nouvel An Amazigh }
      - { day: 05-01, name: Fête du Travail }
      - { day: 07-30, name: Fête du Trône }
      - { day: 08-14, name: Oued Ed-Dahab }
      - { day: 08-20, name: Révolution du Roi et du Peuple }
      - { day: 08-21, name: Fête de la Jeunesse }
      # Decreed in October 2025, so it is absent from older holiday lists.
      - { day: 10-31, name: Fête de l'Unité }
      - { day: 11-06, name: Marche Verte }
      - { day: 11-18, name: Fête de l'Indépendance }

    # The religious days move with the lunar calendar and are fixed by moon sighting, announced
    # only days before — so they live in the database, not here, and admins add or correct them
    # at /admin/holidays without a redeploy. Each start adds only the dates past the last stored
    # holiday, so appending years here extends the calendar while everything already in the table
    # stays as the admins left it. Consecutive days under one name become one entry, so a two-day
    # Aïd is a single holiday of two days.
    #
    # The dates follow the Umm al-Qura calculation, which is routinely a day out from what
    # Morocco observes — confirm each against the official announcement.
    dated:
      - { date: 2026-03-20, name: Aïd Al Fitr }
      - { date: 2026-03-21, name: Aïd Al Fitr }
      - { date: 2026-05-27, name: Aïd Al Adha }
      - { date: 2026-05-28, name: Aïd Al Adha }
      - { date: 2026-06-16, name: Fatih Muharram }
      - { date: 2026-08-25, name: Aïd Al Mawlid }
      - { date: 2026-08-26, name: Aïd Al Mawlid }
      - { date: 2027-03-09, name: Aïd Al Fitr }
      - { date: 2027-03-10, name: Aïd Al Fitr }
      - { date: 2027-05-16, name: Aïd Al Adha }
      - { date: 2027-05-17, name: Aïd Al Adha }
      - { date: 2027-06-06, name: Fatih Muharram }
      - { date: 2027-08-14, name: Aïd Al Mawlid }
      - { date: 2027-08-15, name: Aïd Al Mawlid }
      - { date: 2028-02-27, name: Aïd Al Fitr }
      - { date: 2028-02-28, name: Aïd Al Fitr }
      - { date: 2028-05-05, name: Aïd Al Adha }
      - { date: 2028-05-06, name: Aïd Al Adha }
      - { date: 2028-05-25, name: Fatih Muharram }
      - { date: 2028-08-03, name: Aïd Al Mawlid }
      - { date: 2028-08-04, name: Aïd Al Mawlid }
      - { date: 2029-02-15, name: Aïd Al Fitr }
      - { date: 2029-02-16, name: Aïd Al Fitr }
      - { date: 2029-04-24, name: Aïd Al Adha }
      - { date: 2029-04-25, name: Aïd Al Adha }
      - { date: 2029-05-14, name: Fatih Muharram }
      - { date: 2029-07-24, name: Aïd Al Mawlid }
      - { date: 2029-07-25, name: Aïd Al Mawlid }
      - { date: 2030-02-04, name: Aïd Al Fitr }
      - { date: 2030-02-05, name: Aïd Al Fitr }
      - { date: 2030-04-13, name: Aïd Al Adha }
      - { date: 2030-04-14, name: Aïd Al Adha }
      - { date: 2030-05-03, name: Fatih Muharram }
      - { date: 2030-07-13, name: Aïd Al Mawlid }
      - { date: 2030-07-14, name: Aïd Al Mawlid }

  security:
    bootstrap:
      # Created only when the account table is empty, so there is someone to sign in as.
      email: ${REMOTE_ADMIN_EMAIL:admin@cirestechnologies.ma}
      # Leave unset and a random one is generated and printed to the log once. Either way it
      # is temporary and must be replaced at first sign-in.
      password: ${REMOTE_ADMIN_PASSWORD:}

    # Shared secret for machine callers, sent as the X-Service-Token header and treated as an
    # admin. Empty means no token is accepted at all, which is the default.
    service-token: ${REMOTE_SERVICE_TOKEN:}

  job:
    # Off: admins generate each week themselves from the page. The job is kept, not removed —
    # flip this to true (or set REMOTE_JOB_ENABLED=true) and it plans the coming week again,
    # which only works on a host that is awake at the time.
    enabled: ${REMOTE_JOB_ENABLED:false}
    # Every Thursday at 08:00, planning the week that starts the following Monday.
    cron: "0 0 8 * * THU"
    zone: Africa/Casablanca

logging:
  level:
    cires.dft.remotescheduler: INFO
