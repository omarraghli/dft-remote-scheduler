<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/chrome :: head('Sign in')}"></head>
<body class="centred">

<main class="gate">
    <div class="gate-mark">
        <span class="mark-name">Remote</span>
        <span class="mark-rule" aria-hidden="true"></span>
        <span class="mark-unit">DFT</span>
    </div>

    <p class="note note-ok" th:if="${message}" th:text="${message}"></p>
    <p class="note note-err" th:if="${error}" th:text="${error}"></p>

    <form method="post" th:action="@{/login}" class="stack">
        <label class="field">
            <span>Email</span>
            <input type="email" name="username" autocomplete="username" required autofocus>
        </label>

        <label class="field">
            <span>Password</span>
            <input type="password" name="password" autocomplete="current-password" required>
        </label>

        <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>

    <p class="gate-foot">Accounts are created by an admin.</p>
</main>

</body>
</html>
