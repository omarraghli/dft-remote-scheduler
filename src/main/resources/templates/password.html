<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change password — Remote</title>
    <meta name="color-scheme" content="light dark">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (t === 'light' || t === 'dark') {
                    document.documentElement.setAttribute('data-theme', t);
                }
            } catch (e) { /* fall back to the system theme */ }
        })();
    </script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="centred">

<main class="gate">
    <div class="gate-mark">
        <span class="mark-name">Remote</span>
        <span class="mark-rule" aria-hidden="true"></span>
        <span class="mark-unit">DFT</span>
    </div>

    <h1 class="gate-title" th:text="${forced} ? 'Choose a password' : 'Change your password'">
        Choose a password</h1>

    <p class="gate-lead" th:if="${forced}">
        You signed in with a temporary password. Pick your own to carry on.
    </p>

    <p class="note note-err" th:if="${error}" th:text="${error}"></p>

    <form method="post" th:action="@{/password}" class="stack">
        <label class="field">
            <span th:text="${forced} ? 'Temporary password' : 'Current password'">Current password</span>
            <input type="password" name="currentPassword" autocomplete="current-password" required autofocus>
        </label>

        <label class="field">
            <span>New password</span>
            <input type="password" name="newPassword" autocomplete="new-password"
                   minlength="10" required>
            <small>At least 10 characters.</small>
        </label>

        <label class="field">
            <span>New password again</span>
            <input type="password" name="confirmPassword" autocomplete="new-password"
                   minlength="10" required>
        </label>

        <button type="submit" class="btn btn-primary btn-block">Save password</button>
    </form>

    <p class="gate-foot">
        <span th:text="${email}">you@example.com</span> ·
        <a th:href="@{/logout}">sign out</a>
    </p>
</main>

</body>
</html>
