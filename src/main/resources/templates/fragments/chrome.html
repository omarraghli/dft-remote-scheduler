<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!--
  The chrome every signed-in page wears. Kept in one place because the bar drifted once
  already: each page grew its own set of links, only the chart had the theme switch, and
  nothing told you which page you were on.
-->

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' — Remote'">Remote</title>
    <meta name="color-scheme" content="light dark">
    <script>
        // Runs before the stylesheet paints, so a stored theme never flashes the other one.
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (t === 'light' || t === 'dark') {
                    document.documentElement.setAttribute('data-theme', t);
                }
            } catch (e) { /* private mode, blocked storage — fall back to the system theme */ }
        })();
    </script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon"
          href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%2314161c'/><rect x='3' y='4' width='3' height='8' rx='1' fill='%23e6e8ef'/><rect x='8' y='4' width='5' height='8' rx='1' fill='%234b3fd4'/></svg>">
</head>

<body>

<!--
  active   which nav link to mark as the page you are on

  The section links carry the week being viewed, so stepping from the chart to the grid and
  back stays on the same week rather than snapping to today. The week arrows are not in here:
  four sections, an email address and a date range do not fit on one line, and a bar that wraps
  reads as broken. They get the strip below instead.
-->
<header class="bar" th:fragment="bar(active)">
    <a class="mark" th:href="@{/}">
        <span class="mark-name">Remote</span>
        <span class="mark-rule" aria-hidden="true"></span>
        <span class="mark-unit">DFT</span>
    </a>

    <nav class="nav" aria-label="Sections">
        <a class="nav-link" th:classappend="${active == 'chart'} ? 'is-on' : ''"
           th:attr="aria-current=${active == 'chart'} ? 'page' : null"
           th:href="${shownWeek != null} ? @{/(week=${shownWeek})} : @{/}">Chart</a>

        <a class="nav-link" sec:authorize="hasRole('ADMIN')"
           th:classappend="${active == 'week'} ? 'is-on' : ''"
           th:attr="aria-current=${active == 'week'} ? 'page' : null"
           th:href="${shownWeek != null}
                    ? @{/admin/week(week=${shownWeek})} : @{/admin/week}">Semaine</a>

        <a class="nav-link" sec:authorize="hasRole('ADMIN')"
           th:classappend="${active == 'vacations'} ? 'is-on' : ''"
           th:attr="aria-current=${active == 'vacations'} ? 'page' : null"
           th:href="@{/admin/vacations}">Congés</a>

        <a class="nav-link" sec:authorize="hasRole('ADMIN')"
           th:classappend="${active == 'holidays'} ? 'is-on' : ''"
           th:attr="aria-current=${active == 'holidays'} ? 'page' : null"
           th:href="@{/admin/holidays}">Fériés</a>

        <a class="nav-link" sec:authorize="hasRole('ADMIN')"
           th:classappend="${active == 'users'} ? 'is-on' : ''"
           th:attr="aria-current=${active == 'users'} ? 'page' : null"
           th:href="@{/admin/users}">Accounts</a>
    </nav>

    <div class="bar-right">
        <div class="theme" role="radiogroup" aria-label="Colour theme">
            <button type="button" class="theme-opt" data-theme-set="light"
                    role="radio" aria-checked="false" title="Light">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
                </svg>
                <span class="sr-only">Light</span>
            </button>

            <button type="button" class="theme-opt" data-theme-set="system"
                    role="radio" aria-checked="false" title="Match the system">
                Auto<span class="sr-only"> — match the system</span>
            </button>

            <button type="button" class="theme-opt" data-theme-set="dark"
                    role="radio" aria-checked="false" title="Dark">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
                </svg>
                <span class="sr-only">Dark</span>
            </button>
        </div>

        <a class="who" th:href="@{/password}" title="Signed in — change password">
            <span class="who-name" sec:authentication="name">you@example.com</span>
            <span class="tag" sec:authorize="hasRole('ADMIN')">admin</span>
        </a>

        <a class="btn btn-quiet btn-sm" th:href="@{/logout}">Sign out</a>
    </div>
</header>

<!--
  The week being looked at, and the ways to change it. Its own strip under the bar: it belongs
  to the page rather than to the site, it is the control both week pages are actually used
  through, and it is the same in both places.

  weekBase   the path the arrows step through — "/" for the chart, "/admin/week" for the grid
-->
<div class="weekbar-strip" th:fragment="weekbar(weekBase)">
    <nav class="weekbar wrap" aria-label="Week">
        <div class="weekbar-nav">
            <a class="step" th:href="@{__${weekBase}__(week=${prevWeek})}" rel="prev"
               th:title="'Week of ' + ${prevWeek}" aria-label="Previous week">&#8249;</a>

            <span class="weekbar-mid">
                <b th:text="'W' + ${weekNumber}">W39</b>
                <span th:text="${weekRange}">21 – 25 sept. 2026</span>
            </span>

            <a class="step" th:href="@{__${weekBase}__(week=${nextWeek})}" rel="next"
               th:title="'Week of ' + ${nextWeek}" aria-label="Next week">&#8250;</a>
        </div>

        <div class="weekbar-now">
            <a class="today" th:href="@{__${weekBase}__}"
               th:classappend="${shownWeek == currentWeek} ? 'is-hidden' : ''">Today</a>

            <span th:if="${shownWeek == currentWeek}" class="pill pill-now">This week</span>
            <span th:if="${shownWeek > currentWeek}" class="pill">Upcoming</span>
            <span th:if="${shownWeek < currentWeek}" class="pill pill-past">Past</span>
        </div>
    </nav>
</div>

<footer class="wrap foot" th:fragment="foot(hint)">
    <span>dft-remote-scheduler</span>
    <span class="foot-sep">·</span>
    <a th:href="@{/api/schedules}">API</a>
    <span th:if="${hint}" class="foot-sep">·</span>
    <span th:if="${hint}" class="kbd-hint"><kbd>&larr;</kbd><kbd>&rarr;</kbd> to change week</span>
</footer>

<script th:fragment="theme-script">
    // Light / System / Dark. "System" simply removes the override.
    (function () {
        var root = document.documentElement;
        var buttons = document.querySelectorAll('[data-theme-set]');

        function stored() {
            try {
                var t = localStorage.getItem('theme');
                return (t === 'light' || t === 'dark') ? t : 'system';
            } catch (e) { return 'system'; }
        }

        function apply(choice) {
            if (choice === 'light' || choice === 'dark') {
                root.setAttribute('data-theme', choice);
            } else {
                root.removeAttribute('data-theme');
            }

            buttons.forEach(function (b) {
                var on = b.getAttribute('data-theme-set') === choice;
                b.classList.toggle('is-on', on);
                b.setAttribute('aria-checked', String(on));
            });
        }

        buttons.forEach(function (b) {
            b.addEventListener('click', function () {
                var choice = b.getAttribute('data-theme-set');
                try {
                    if (choice === 'system') localStorage.removeItem('theme');
                    else localStorage.setItem('theme', choice);
                } catch (e) { /* not stored, but the page still switches for this visit */ }
                apply(choice);
            });
        });

        apply(stored());
    })();
</script>

</body>
</html>
